# Vaysen外贸系统 — 局域网 / ZeroTier 单入口
# 浏览器与 Electron 都通过同源 /api 访问后端，不暴露公网域名或 TLS 证书依赖。

# Docker service containers may be replaced without restarting the edge
# container (for example after a same-release Weixin owner enrollment).  Nginx
# 1.27.5 supports periodically resolved OSS upstream members; keep the shared
# zones so workers adopt Docker DNS changes without retaining removed IPs.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream vaysen-crm_backend_upstream {
    zone vaysen-crm_backend_upstream 64k;
    server backend:4000 resolve;
}

upstream vaysen-crm_frontend_upstream {
    zone vaysen-crm_frontend_upstream 64k;
    server frontend:3000 resolve;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        proxy_pass http://vaysen-crm_backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://vaysen-crm_backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI/WhatsApp 事件流可能长时间无数据；禁止缓冲并保留长连接。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass http://vaysen-crm_backend_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /customizer-assets/ {
        proxy_pass http://vaysen-crm_backend_upstream/customizer-assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://vaysen-crm_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
