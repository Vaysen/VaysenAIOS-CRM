# =============================================================================
# vaysen-ai-crm - Docker Compose 生产部署配置 (Linux 服务器)
# 仅 nginx 暴露端口到宿主机，内部服务通过 internal 网络通信
# 使用方式：docker-compose --env-file .env up -d
# =============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 数据库
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vaysen-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-vaysen-crm}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vaysen-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Redis 缓存 / 消息队列
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vaysen-crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 后端 NestJS 服务
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vaysen-crm-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@postgres:5432/vaysen-crm?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret-key}
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY:-change-me-32-chars-encryption!!}
      - PYTHON_SERVICE_URL=${PYTHON_SERVICE_URL:-http://python-service:5000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # AI 服务配置（按需填写）
      - AI_EXTERNAL_CALLS_ENABLED=${AI_EXTERNAL_CALLS_ENABLED:-true}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-4-flash-250414}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      # AI 路由策略
      - AI_ROUTE_CLEAN=${AI_ROUTE_CLEAN:-zhipu,ollama,nvidia}
      - AI_ROUTE_PROFILE=${AI_ROUTE_PROFILE:-zhipu,ollama,nvidia}
      - AI_ROUTE_EMAIL=${AI_ROUTE_EMAIL:-zhipu,ollama}
      - AI_ROUTE_RESEARCH=${AI_ROUTE_RESEARCH:-zhipu,nvidia}
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ----------------------------------------------------------------------------
  # Python 微服务 (rembg 去背景 + PDF 转图片)
  # ----------------------------------------------------------------------------
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: vaysen-crm-python-service
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - python-temp:/tmp/rembg
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Nginx 反向代理 (唯一对外暴露端口的服务)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: vaysen-crm-nginx
    restart: unless-stopped
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
      # SSL 证书目录（有证书后取消下方注释）
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# 持久化卷
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  backend-uploads:
    driver: local
  backend-logs:
    driver: local
  python-temp:
    driver: local
  nginx-logs:
    driver: local

# =============================================================================
# 网络
# =============================================================================
networks:
  internal:
    driver: bridge
